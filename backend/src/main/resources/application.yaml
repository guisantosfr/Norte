spring:
  application:
    name: norte-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

app:
  timezone: ${APP_TIMEZONE}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

notifications:
  reminder:
    cron: ${NOTIFICATION_REMINDER_CRON}
    zone: ${NOTIFICATION_REMINDER_ZONE:${app.timezone}}
    run-on-startup: ${NOTIFICATION_REMINDER_RUN_ON_STARTUP}

# Documentação OpenAPI/Swagger desligada por padrão.
# Habilitada apenas no perfil "dev" (ver application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false