spring:
  application:
    name: norte-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

auth:
  refresh-token:
    expiration-days: ${AUTH_REFRESH_TOKEN_EXPIRATION_DAYS}
    inactivity-days: ${AUTH_REFRESH_TOKEN_INACTIVITY_DAYS}
  rate-limit:
    enabled: ${AUTH_RATE_LIMIT_ENABLED}
    trust-proxy-headers: ${AUTH_RATE_LIMIT_TRUST_PROXY_HEADERS}
    login:
      capacity: ${AUTH_RATE_LIMIT_LOGIN_CAPACITY}
      duration-seconds: ${AUTH_RATE_LIMIT_LOGIN_DURATION_SECONDS}
    register:
      capacity: ${AUTH_RATE_LIMIT_REGISTER_CAPACITY}
      duration-seconds: ${AUTH_RATE_LIMIT_REGISTER_DURATION_SECONDS}

app:
  timezone: ${APP_TIMEZONE}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

notifications:
  reminder:
    cron: ${NOTIFICATION_REMINDER_CRON}
    zone: ${NOTIFICATION_REMINDER_ZONE:${app.timezone}}
    run-on-startup: ${NOTIFICATION_REMINDER_RUN_ON_STARTUP}

# Documentação OpenAPI/Swagger desligada por padrão.
# Habilitada apenas no perfil "dev" (ver application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false